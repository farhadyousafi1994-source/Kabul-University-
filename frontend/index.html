<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Kabul University Asset Management System" />
    <meta name="theme-color" content="#1b5e20" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>KU-AMS — Kabul University Asset Management</title>
    <!-- Typography — the families offered by Appearance → Typography. Loaded
         with display=swap so text paints immediately with the system stack. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600;700&family=Poppins:wght@400;500;600;700&family=Noto+Sans:wght@400;600;700&display=swap"
    />
    <script>
      // Apply the saved direction before first paint so Dari/Pashto/Arabic
      // users never see an LTR flash (Quasar's RTL rules are scoped [dir=rtl]).
      ;(function () {
        try {
          var code = localStorage.getItem('ku_ams_locale')
          var rtl = code === 'fa' || code === 'ps' || code === 'ar'
          document.documentElement.setAttribute('dir', rtl ? 'rtl' : 'ltr')
          if (code) document.documentElement.setAttribute('lang', code)
        } catch (e) { /* localStorage unavailable */ }
      })()
    </script>
  </head>
  <body>
    <div id="q-app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
